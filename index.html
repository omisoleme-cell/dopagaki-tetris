<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@600;700&family=Dela+Gothic+One&family=Orbitron:wght@700;800;900&family=Russo+One&family=Teko:wght@600;700&family=Reggae+One&display=swap" rel="stylesheet"><title>どぱがきテトリス | COMBO HYPER</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><h1><span class="title-spark">⚡</span> どぱがきテトリス <span class="title-spark">⚡</span></h1><p>8人でブチ上がれ！ 超絶フィーバー・ブロックバトル</p><div class="audio-toolbar"><button id="musicToggle" type="button">♫ BGM ON</button><button id="soundToggle" type="button">♪ SE ON</button><label>音量 <input id="volumeControl" type="range" min="0" max="100" value="46"></label><label>演出 <select id="effectsMode"><option value="full">どぱがきMAX</option><option value="low">ひかえめ</option><option value="off">OFF</option></select></label></div></header>
<section id="lobby" class="panel"><input id="name" maxlength="16" placeholder="プレイヤー名" value="Player"><div class="actions"><button id="create">部屋を作成</button><input id="codeInput" maxlength="6" placeholder="6文字の部屋コード"><button id="join">参加</button></div><p id="roomText"></p><div id="members"></div><button id="start" hidden>対戦開始</button></section>
<section id="arena" hidden><div class="battle-marquee">DOPA GAKI ⚡ FEVER TIME ⚡ DOPA GAKI ⚡ FEVER TIME</div><div class="panel top"><span id="status">対戦中</span><span id="attack">送信ライン: 0</span><span id="incoming">お邪魔予告: 0段</span><span id="attacker">攻撃元: —</span></div><div class="meterTrack"><div id="garbageMeter"></div></div><div id="effectOverlay" aria-hidden="true"><div id="effectCaption"></div><div id="effectSubtitle"></div></div><div id="screenFlash" aria-hidden="true"></div><div id="dangerVignette" aria-hidden="true"></div><canvas id="particleLayer" aria-hidden="true"></canvas><div id="dangerLabel" aria-live="off"></div><div id="comboPop" aria-hidden="true"></div><div id="comboFever" aria-hidden="true"><div id="comboFeverCount"></div><div id="comboFeverText">COMBO</div><div id="comboFeverSub"></div></div><div id="jackpotFX" aria-hidden="true"><div class="jackpot-beams"></div><div class="jackpot-halo"></div><div class="jackpot-stamp" id="jackpotStamp"></div><div class="jackpot-ren" id="jackpotRen"></div><div class="jackpot-sub" id="jackpotSub"></div></div><div id="stageLights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="arena"><div id="leftOpponents" class="opponentColumn leftOpponents" aria-label="左側の対戦相手"></div><div class="own"><div class="scoreboard"><div class="scoreMain"><span>SCORE</span><strong id="score">0000000</strong></div><div class="scoreSub"><div><span>LINES</span><strong id="lines">0</strong></div><div><span>LEVEL</span><strong id="level">1</strong></div><div><span>COMBO</span><strong id="combo">—</strong></div><div><span>REN</span><strong id="ren">0</strong></div></div><p id="scoreEvent" aria-live="polite">READY</p></div><div class="gameRow"><div class="holdPanel"><strong>HOLD</strong><canvas id="holdCanvas" width="100" height="90"></canvas><small>C / Shift</small></div><div class="mainBoardFrame"><div class="boardFrameHUD"><span>YOU / DOPA GAKI</span><span>★ LIVE ★</span></div><canvas id="board" width="240" height="480"></canvas><div class="board-gleam" aria-hidden="true"></div></div><div class="nextPanel"><strong>NEXT</strong><canvas class="next-piece" width="100" height="67"></canvas><canvas class="next-piece" width="100" height="54"></canvas><canvas class="next-piece" width="100" height="54"></canvas><canvas class="next-piece" width="100" height="54"></canvas><canvas class="next-piece" width="100" height="54"></canvas></div></div><div class="targetPanel"><label>攻撃ターゲット <select id="targetMode"><option value="random">ランダム</option><option value="attackers">カウンター（自分を狙う人）</option><option value="ko">とどめ（ピンチの人）</option><option value="manual">プレイヤー指定</option></select></label><select id="targetPlayer" disabled aria-label="指定するプレイヤー"></select><div id="targetStatus">攻撃設定: ランダム</div></div><div class="keys">← → 移動　↑ 回転　↓ 落下　Space 即落下　C / Shift ホールド</div></div><div id="rightOpponents" class="opponentColumn rightOpponents" aria-label="右側の対戦相手"></div></div></section>
<p id="message" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script src="/effects.js"></script><script src="/game.js"></script></body></html>
